name: yttrending-local

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: yttrending
      POSTGRES_USER: yttrending
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yttrending -d yttrending']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_local_data:/var/lib/postgresql

  migrator:
    profiles: ['tools']
    build:
      context: .
      target: migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=yttrending;Username=yttrending;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=yttrending;Username=yttrending;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Database__AutoMigrate: 'false'
      Jobs__SyncEnabled: 'false'
      Jobs__MetricsUpdateEnabled: 'false'
      YouTube__UseFake: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    volumes:
      - api_local_logs:/app/logs

volumes:
  postgres_local_data:
  api_local_logs:
